<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CATI · PRO｜测测你是哪只小猫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="测测你是哪只小猫：24 道题，16 只猫，测完让 ta 先猜你是哪只。">
<meta name="theme-color" content="#F4F2EC">
<style>
/* 版式跟原版 cati 一致：米色纸面、方角、黑色按钮、细字重、拉开字距的小标签；只有浅色一种样子 */
:root {
  --page: #F4F2EC;
  --bg: #F7F5F0;
  --panel-2: #EDEAE2;
  --border: #D9D6CD;
  --ink-1: #2A2A28;
  --ink-2: #7C7B76;
  --ink-3: #9A988F;
  --accent: #2A2A28;
  --on-accent: #F4F2EC;
  --outer: #CFCDC7;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--outer); color: var(--ink-1);
  font-family: var(--font); font-weight: 300; font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink-1); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { display: block; }

.phone { max-width: 560px; margin: 0 auto; min-height: 100vh; background: var(--page); position: relative; }
@media (min-width: 561px) { body { padding-block: 20px; } .phone { min-height: calc(100vh - 40px); } }

.screen {
  padding-block: 24px 36px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.screen.enter { animation: fadeUp .5s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- 按钮 ---------- */
.btn {
  appearance: none; border: 0; border-radius: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; font-size: 17px; padding: 16px 24px;
  transition: transform .18s cubic-bezier(.16, 1, .3, 1), opacity .15s ease;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-ghost { background: var(--bg); color: var(--ink-1); border: 1px solid var(--border); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { background: none; border: 0; padding: 6px 2px; color: var(--ink-2); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.spaced { font-size: 12px; letter-spacing: .26em; color: var(--ink-2); font-weight: 400; }
.lat { letter-spacing: 0; }

/* ---------- 封面 ---------- */
#s-cover { align-items: center; text-align: center; padding-top: 44px; gap: 0; }
.wordmark { font-size: clamp(40px, 13vw, 60px); font-weight: 800; letter-spacing: -.02em; line-height: 1; margin: 0; white-space: nowrap; }
.cover-sub { margin: 16px 0 0; font-size: 22px; line-height: 1.4; font-weight: 600; }
.cat-stage { width: 210px; height: 210px; margin: 16px auto 6px; overflow: hidden; }
.cat-stage svg { width: 210px !important; height: 210px !important; }
#s-cover .btn-primary { padding: 16px 46px; }
.hint { margin-top: 14px; font-size: 13px; color: var(--ink-3); }
.cover-more { margin-top: 26px; display: grid; gap: 10px; width: 100%; max-width: 320px; }
.me-card { display: flex; align-items: center; gap: 12px; padding: 10px 14px; width: 100%; background: var(--bg); border: 1px solid var(--border); text-align: left; }
.me-card .mini { width: 42px; height: 42px; flex: none; }
.me-card .mini svg { width: 100%; height: 100%; }
.me-card b { display: block; font-size: 14px; font-weight: 600; }
.me-card small { color: var(--ink-3); font-size: 12px; }

/* ---------- 答题 ---------- */
.topbar { display: grid; grid-template-columns: 88px 1fr 88px; align-items: center; }
.prev-btn { width: 44px; height: 36px; border: 0; background: none; font-size: 20px; color: var(--ink-1); text-align: left; padding: 0; }
.progress-text { text-align: center; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.brand { text-align: right; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); white-space: nowrap; }
.bar { height: 3px; background: var(--panel-2); }
.bar i { display: block; height: 100%; background: var(--ink-1); transition: width .35s ease; }
.q-card { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 4px 0 6px; }
.q-cat { width: 150px; height: 150px; overflow: hidden; }
.q-cat svg { width: 150px !important; height: 150px !important; }
.q-title { font-size: 22px; line-height: 1.45; font-weight: 700; margin: 0; word-break: keep-all; overflow-wrap: anywhere; }
.q-hint { font-size: 13px; color: var(--ink-3); margin: 0; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 15px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 0;
  font-size: 16px; line-height: 1.5; font-weight: 400; transition: border-color .15s ease, background .15s ease;
}
.opt .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex: none; }
.opt.multi .dot { border-radius: 0; }
.opt[aria-pressed="true"] { border-color: var(--ink-1); background: var(--panel-2); }
.opt[aria-pressed="true"] .dot { background: var(--ink-1); }
.opt .txt { flex: 1; min-width: 0; }
.fish-row { display: flex; gap: 8px; }
.fish-row .opt { flex: 1; min-width: 0; }
.fishes { display: flex; gap: 2px; flex: none; }
.fishes svg { width: 24px; height: 15px; }
.fishes .off { opacity: .2; }
.minus { width: 46px; border: 1px solid var(--border); background: var(--bg); font-size: 20px; font-weight: 600; flex: none; }
.quiz-foot { display: grid; gap: 8px; }
.fish-left { margin: 0; text-align: center; font-size: 13px; color: var(--ink-3); }

/* ---------- 结果 ---------- */
.res-hero {
  margin: -24px calc(-1 * max(24px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(24px, env(safe-area-inset-left, 0px)));
  padding: 26px 24px 22px; display: grid; justify-items: center; text-align: center; gap: 2px; position: relative;
}
.res-hero .no { position: absolute; left: 24px; top: 20px; font-size: 12px; color: var(--ink-2); letter-spacing: .12em; }
.res-hero .badge { position: absolute; right: 24px; top: 18px; font-size: 12px; font-weight: 600; padding: 3px 10px; background: var(--ink-1); color: var(--on-accent); letter-spacing: .12em; }
.res-cat { width: min(100%, 330px); aspect-ratio: 384 / 256; }
.res-cat svg { width: 100%; height: 100%; }
.res-name { font-size: 40px; font-weight: 800; line-height: 1.15; margin: 4px 0 0; }
.res-title { font-size: 17px; font-weight: 600; margin: 4px 0 8px; }
.res-form { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }

.box { background: var(--bg); border: 1px solid var(--border); padding: 18px 20px; display: grid; gap: 12px; min-width: 0; }
.box-title { font-size: 13px; letter-spacing: .2em; color: var(--ink-2); font-weight: 400; margin: 0; }
.desc { font-size: 15.5px; line-height: 1.9; margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tag { font-size: 13px; color: var(--ink-2); background: var(--panel-2); padding: 5px 12px; }
.sub-cats { display: grid; gap: 8px; }
.sub-cat { display: flex; align-items: center; gap: 10px; background: var(--panel-2); padding: 10px 14px; font-size: 14px; line-height: 1.5; }
.sub-cat .mini { width: 34px; height: 34px; flex: none; }
.sub-cat .mini svg { width: 100%; height: 100%; }
.sub-cat > span:nth-child(2) { flex: 1; min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
.sub-cat b { font-weight: 600; }
.sub-cat .pct { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.dims { display: grid; gap: 14px; }
.dim { display: grid; grid-template-columns: 3.5em 1fr 3.5em; align-items: center; gap: 10px; font-size: 13px; }
.dim .l { text-align: left; } .dim .r { text-align: right; }
.dim .on { color: var(--ink-1); font-weight: 600; }
.dim .off { color: var(--ink-3); }
.track { position: relative; height: 18px; background: var(--panel-2); }
.track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.track .fill { position: absolute; top: 0; bottom: 0; background: var(--ink-1); }
.dim-lean { grid-column: 1 / -1; text-align: center; font-size: 12px; color: var(--ink-2); margin-top: -8px; }

.twin { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.twin > div { background: var(--panel-2); padding: 12px 14px; min-width: 0; }
.twin small { display: block; font-size: 12px; color: var(--ink-2); letter-spacing: .1em; }
.twin p { margin: 2px 0 0; font-size: 14.5px; font-weight: 600; line-height: 1.5; word-break: keep-all; overflow-wrap: break-word; overflow-wrap: anywhere; }
.says { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 15px; }
.says li::before { content: "· "; color: var(--ink-3); }
.pair-box { display: grid; gap: 8px; }
.pair-item { background: var(--panel-2); padding: 12px 16px; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
.pair-item b { color: var(--ink-1); font-weight: 600; }
.pair-item button { background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink-1); }

.duo { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 4px; }
.duo .mini { padding: 6px 4px; display: grid; justify-items: center; gap: 2px; }
.duo .mini svg { width: 80px; height: 80px; }
.duo .mini b { font-size: 14px; font-weight: 600; }
.duo .mini small { font-size: 12px; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duo .x { font-size: 22px; font-weight: 300; color: var(--ink-2); }
.rel-name { margin: 0; font-size: 26px; font-weight: 800; text-align: center; }
.rel-sub { margin: -8px 0 0; text-align: center; font-size: 14px; color: var(--ink-2); }
.rel-lines { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 15px; }

.actions { display: grid; gap: 10px; margin-top: 4px; }
.linkbox { margin: 0; font-size: 12.5px; color: var(--ink-2); word-break: break-all; background: var(--panel-2); padding: 10px 12px; user-select: all; -webkit-user-select: all; }

/* ---------- 先猜再看 ---------- */
.guess-head { display: grid; justify-items: center; text-align: center; gap: 6px; padding-top: 12px; }
.guess-head h1 { margin: 0; font-size: 24px; line-height: 1.4; font-weight: 700; word-break: keep-all; overflow-wrap: anywhere; }
.guess-head p { margin: 0; color: var(--ink-2); font-size: 15px; }
.pick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pick { border: 1px solid var(--border); background: var(--bg); padding: 4px 2px 8px; display: grid; justify-items: center; gap: 1px; transition: transform .15s ease; }
.pick:active { transform: scale(.96); }
.pick svg { width: 100%; height: auto; aspect-ratio: 1; }
.pick span { font-size: 13px; font-weight: 600; line-height: 1.2; }
.verdict { margin: 0; text-align: center; font-size: 24px; font-weight: 800; }
.verdict-sub { margin: -6px 0 0; text-align: center; color: var(--ink-2); font-size: 15px; }

/* ---------- 图鉴 ---------- */
.gallery-head { display: flex; align-items: center; gap: 12px; }
.g-back { border: 1px solid var(--border); background: var(--bg); padding: 6px 12px; font-size: 14px; }
.g-title { font-size: 20px; font-weight: 700; flex: 1; margin: 0; }
.g-count { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.gallery-list { display: grid; gap: 12px; }
.g-card { background: var(--bg); border: 1px solid var(--border); padding: 16px; display: grid; gap: 10px; }
.g-head { display: flex; gap: 12px; align-items: flex-start; }
.g-icon { width: 52px; height: 52px; flex: none; }
.g-icon svg { width: 100%; height: 100%; }
.g-icon.locked svg { filter: brightness(0); opacity: .15; }
.g-name { font-size: 17px; font-weight: 700; line-height: 1.35; }
.g-no { font-size: 11px; color: var(--ink-3); letter-spacing: .12em; }
.g-tags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.g-tag { font-size: 11px; color: var(--ink-3); border: 1px solid var(--border); padding: 2px 8px; }
.g-who { font-size: 11px; font-weight: 600; background: var(--ink-1); color: var(--on-accent); padding: 2px 8px; margin-left: auto; flex: none; max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-desc { font-size: 14px; line-height: 1.8; color: var(--ink-2); margin: 0; }
.g-pair { font-size: 13px; color: var(--ink-3); margin: 0; }
.g-pair span { display: inline-block; }

/* ---------- 猫的小动画：眨眼、甩尾巴 ---------- */
.anim .ca-lid { transform-box: fill-box; transform-origin: 50% 0%; animation: blink 4.6s infinite; }
.anim .ca-tail { transform-box: view-box; transform-origin: 254px 294px; animation: swish 3s ease-in-out infinite; }
@keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(2.3); } }
@keyframes swish { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }

/* ---------- 弹层 ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 30; background: rgba(42, 42, 40, .5);
  display: flex; align-items: flex-end; justify-content: center;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
}
.sheet {
  width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: var(--page);
  display: grid; gap: 14px; align-content: start;
  padding-block: 16px max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-top b { font-size: 16px; font-weight: 700; }
.poster-choice { display: grid; justify-items: start; gap: 4px; text-align: left; }
.poster-choice small { font-size: 13px; font-weight: 400; opacity: .75; }
.x-btn { width: 36px; height: 36px; border: 1px solid var(--border); background: var(--bg); font-size: 18px; line-height: 1; }
.sheet .res-hero { margin: 0; }
.poster { width: 100%; border: 1px solid var(--border); background: var(--bg); }
.poster-note { margin: 0; text-align: center; font-size: 13px; color: var(--ink-3); }
.toast {
  position: fixed; left: 50%; bottom: max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px)); transform: translateX(-50%);
  background: var(--ink-1); color: var(--on-accent); padding: 10px 16px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-fish" viewBox="0 0 34 20"><path d="M2,10 Q12,0 24,10 Q12,20 2,10 Z" fill="#7FB3D6"/><path d="M23,10 L32,3 L31,17 Z" fill="#7FB3D6"/><circle cx="8" cy="9" r="1.6" fill="#2A2A28"/></symbol>
</svg>

<div class="phone">

  <!-- 封面 -->
  <section class="screen" id="s-cover" aria-labelledby="cover-title">
    <h1 class="wordmark" id="cover-title">CATI · PRO</h1>
    <p class="cover-sub">测测你是哪只小猫(￣﹃￣)</p>
    <div class="cat-stage" id="cover-cat" aria-hidden="true"></div>
    <button class="btn btn-primary" id="btn-start" type="button">开始测试</button>
    <div class="hint">3min 测测你是什么性格的小猫</div>
    <div class="cover-more">
      <button class="me-card" id="btn-me" type="button" hidden></button>
      <button class="btn btn-ghost" id="btn-gallery" type="button">猫猫图鉴</button>
    </div>
  </section>

  <!-- 答题 -->
  <section class="screen" id="s-quiz" hidden>
    <div class="topbar">
      <button class="prev-btn" id="btn-back" type="button" aria-label="上一题">←</button>
      <span class="progress-text" id="count"></span>
      <span class="brand">CATI · PRO</span>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar-fill"></i></div>
    <div class="q-card">
      <div class="q-cat" id="q-cat" aria-hidden="true"></div>
      <h2 class="q-title" id="q-title" tabindex="-1"></h2>
      <p class="q-hint" id="q-hint"></p>
    </div>
    <div class="opts" id="opts" role="group" aria-labelledby="q-title"></div>
    <div class="quiz-foot">
      <p class="fish-left" id="fish-left" hidden></p>
      <button class="btn btn-primary" id="btn-next" type="button">下一题</button>
      <button class="link" id="btn-fish-reset" type="button" hidden>重新分小鱼干</button>
    </div>
  </section>

  <!-- 结果 -->
  <section class="screen" id="s-result" hidden></section>

  <!-- 朋友链接：先猜 -->
  <section class="screen" id="s-guess" hidden></section>

  <!-- 图鉴 -->
  <section class="screen" id="s-gallery" hidden></section>

</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/lottie.js"></script>
<script src="js/badcat.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
</body>
</html>
